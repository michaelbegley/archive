<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-+pYFdPy9ssyNVtB1DkqkAdEHf9OHYF1qQe7okkgjaQQ=' 'sha256-TxS+OFkDWFDh2uJyZAIoSux504q8SvebSKGrGqB/oxo=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https://michaelbegley.github.io; connect-src 'self' https://cloudflareinsights.com; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">

<script>try{var t=localStorage.getItem("archive-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  /* ------------------------------------------------------------------
     Tokens. Every size on the page comes from this list.
     ------------------------------------------------------------------ */
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    --page: #ffffff;
    --ink: #1f1e1d;
    --soft: #6f6b66;
    --faint: #b9b5af;
    --mat: #f5f4f1;
    --line: rgba(31, 30, 29, .10);
    --accent: #b85c38;
    --chip: #f5f4f1;               /* pressed pill on the page */
    --menu: #ffffff;
    --barbg: rgba(255, 255, 255, .86);
    --hintbg: rgba(31, 30, 29, .78);

    --s1: 4px; --s2: 8px; --s3: 16px; --s4: 24px; --s5: 32px; --s6: 48px; --s7: 64px; --s8: 96px;
    --pad: var(--s6);          /* page side padding */
    --gap: var(--s5);          /* grid gap, both ways */
    --bar: var(--s7);          /* top bar height */

    --r-tile: 12px; --r-stage: 18px; --r-menu: 12px;

    --move: cubic-bezier(.32, .72, 0, 1);
    --fade: cubic-bezier(.25, .1, .25, 1);
  }
  /* dark: same layout, quieter light */
  :root[data-theme="dark"] {
    --page: #000000; --ink: #f5f5f7; --soft: #a1a1a6; --faint: #5a5a5e; --mat: #1c1c1e;
    --line: rgba(255, 255, 255, .12); --accent: #e08a62; --chip: #2c2c2e; --menu: #1c1c1e;
    --barbg: rgba(0, 0, 0, .72); --hintbg: rgba(44, 44, 46, .9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #000000; --ink: #f5f5f7; --soft: #a1a1a6; --faint: #5a5a5e; --mat: #1c1c1e;
      --line: rgba(255, 255, 255, .12); --accent: #e08a62; --chip: #2c2c2e; --menu: #1c1c1e;
      --barbg: rgba(0, 0, 0, .72); --hintbg: rgba(44, 44, 46, .9);
    }
  }
  @media (max-width: 1024px) { :root { --pad: var(--s4); --gap: var(--s4); } }
  @media (max-width: 600px)  { :root { --pad: var(--s3); --gap: var(--s3); --bar: 56px; } }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--page); -webkit-text-size-adjust: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font: 400 15px/1.47 var(--font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------------
     Top bar. Home: folder and sort on the left, year on the right.
     Piece page: the back link sits where the folder switch was.
     ------------------------------------------------------------------ */
  #bar {
    position: sticky; top: 0; z-index: 10;
    height: var(--bar); padding: 0 var(--pad);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--barbg);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    font-size: 13px; line-height: 16px;
  }
  #bar .side { display: flex; align-items: center; gap: var(--s4); }
  .menu { position: relative; }
  .menu > button, #back {
    display: inline-flex; align-items: center; gap: var(--s2);
    height: 44px;                       /* touch target; the text stays 13px */
    color: var(--soft);
    transition: color .15s var(--fade);
  }
  .menu:first-child > button, #back { color: var(--ink); }
  .menu > button:hover, #back:hover { color: var(--ink); }
  .menu > button svg { width: 8px; height: 5px; flex: none; opacity: .55; transition: transform .2s var(--move); }
  .menu.open > button svg { transform: rotate(180deg); }
  #back svg { width: 6px; height: 10px; flex: none; }
  #theme { width: 44px; height: 44px; margin-right: -12px; display: inline-flex; align-items: center; justify-content: center; color: var(--soft); border-radius: 22px; transition: color .15s var(--fade), transform .15s var(--move); }
  #theme:hover { color: var(--ink); }
  #theme:active { transform: scale(.94); }
  #theme svg { width: 18px; height: 18px; transition: transform .45s var(--move); }
  #theme .moon { display: none; }
  html.is-dark #theme .sun { display: none; }
  html.is-dark #theme .moon { display: block; }

  .menu ul {
    position: absolute; top: calc(100% - 4px); left: calc(var(--s3) * -1);
    min-width: 208px; max-height: min(480px, calc(100vh - var(--bar) - var(--s3))); overflow-y: auto;
    list-style: none; padding: var(--s2) 0;
    background: var(--menu); border-radius: var(--r-menu);
    box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.08);
    opacity: 0; visibility: hidden; transform: translateY(-4px);
    transition: opacity .15s var(--fade), transform .2s var(--move), visibility 0s .2s;
  }
  .menu.right ul { left: auto; right: calc(var(--s3) * -1); min-width: 144px; }
  .menu.open ul { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .menu li.sep { height: 1px; background: var(--line); margin: var(--s2) 0; }
  .menu li > * {
    display: flex; justify-content: space-between; align-items: center; gap: var(--s4);
    width: 100%; height: 32px; padding: 0 var(--s3);
    color: var(--soft); text-align: left;
  }
  .menu li > *:hover, .menu li > [aria-current="true"] { color: var(--ink); }
  .menu li > [aria-current="true"] span:first-child { font-weight: 600; }
  .menu li span + span { color: var(--soft); }
  @media (hover: none) { .menu li > * { height: 44px; } }

  body.one #bar .home-only { display: none; }
  body:not(.one) #bar .piece-only { display: none; }

  /* ------------------------------------------------------------------
     Home: year sections, each an even grid of 16:10 tiles.
     ------------------------------------------------------------------ */
  #home { padding: var(--s4) var(--pad) var(--s8); }
  .year { margin-top: var(--s7); scroll-margin-top: var(--bar); }
  .year:first-child { margin-top: 0; }
  .year h2 {
    font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; color: var(--ink);
    margin-bottom: var(--s4);
  }
  @media (max-width: 600px) { .year { margin-top: var(--s6); } .year h2 { font-size: 24px; line-height: 28px; margin-bottom: var(--s3); } }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: var(--gap);
  }
  @media (max-width: 1024px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
  @media (max-width: 600px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .tile { position: relative; display: block; }
  .frame {
    position: relative; display: block; aspect-ratio: 16 / 10;
    background: var(--mat); border-radius: var(--r-tile); overflow: hidden;
    transition: transform .25s var(--move), box-shadow .25s var(--fade);
  }
  .frame::after {                       /* one hairline on every tile, so white logos keep an edge */
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px var(--line); pointer-events: none;
  }
  .frame img { width: 100%; height: 100%; display: block; object-fit: contain; }
  .frame img.fill { object-fit: cover; object-position: top center; }

  /* peek: hover a site and its tile scrolls slowly down the page, like a visitor would */
  .frame .pk { position: absolute; inset: 0; opacity: 0; transition: opacity .2s var(--fade); pointer-events: none; }
  .frame .pk img { width: 100%; height: auto; display: block; will-change: transform; }
  .frame .sb {                          /* a thin overlay scrollbar, so the motion reads as scrolling */
    position: absolute; top: var(--s1); right: var(--s1); width: 4px; border-radius: 2px;
    background: rgba(0, 0, 0, .45); box-shadow: 0 0 0 1px rgba(255, 255, 255, .55);
    opacity: 0; transition: opacity .2s var(--fade); pointer-events: none; will-change: transform;
  }
  .tile.peeking .pk, .tile.peeking .sb { opacity: 1; }

  /* caption: sits in the gutter under its tile. Hidden until hover on a mouse, always shown on touch. */
  .cap {
    position: absolute; left: 0; right: 0; top: 100%; height: var(--gap);
    display: flex; align-items: center; gap: var(--s2);
    font-size: 13px; line-height: 16px; white-space: nowrap;
  }
  .cap .t { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cap .d { color: var(--soft); margin-left: auto; flex: none; }
  .cap .t, .cap .d { opacity: 0; transition: opacity .15s var(--fade); }
  .tile:hover .cap .t, .tile:hover .cap .d,
  .tile:focus-visible .cap .t, .tile:focus-visible .cap .d { opacity: 1; }
  .tile:focus-visible { outline: none; }
  .tile:focus-visible .frame { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* version marks: one dot per version. Ink = this one, grey = another look, ring = planned. */
  .dots { display: inline-flex; gap: var(--s1); flex: none; }
  .cap .d + .dots { margin-left: 0; }
  .cap .dots { margin-left: auto; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .dots i.on { background: var(--ink); }
  .dots i.plan { background: none; box-shadow: inset 0 0 0 1px var(--faint); }

  @media (hover: hover) and (min-width: 601px) {
    .tile:hover .frame { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.08); }
    .tile:active .frame { transform: scale(.985); }
  }
  @media (hover: none), (max-width: 600px) {
    .cap { position: static; height: 16px; margin-top: var(--s2); }
    .cap .t, .cap .d { opacity: 1; }
    .grid { row-gap: var(--s4); }
  }
  @media (max-width: 600px) { .cap .d { display: none; } }

  .empty { color: var(--soft); font-size: 13px; padding: var(--s3) 0; }

  /* ------------------------------------------------------------------
     Piece page. One layout for every kind: stage, versions, words, facts.
     ------------------------------------------------------------------ */
  #piece { display: none; padding: 0 var(--pad) var(--s8); }
  body.one #home { display: none; }
  body.one #piece { display: block; }
  /* the stage is as wide as it can be while it, the versions row and the title still fit on one screen */
  #piece .col { width: 100%; max-width: min(1080px, max(320px, calc((100vh - 264px) * 1.6))); margin: 0 auto; }

  #stage {
    position: relative; aspect-ratio: 16 / 10; overflow: hidden;
    background: var(--mat); border-radius: var(--r-stage);
  }
  #stage::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: inset 0 0 0 1px var(--line); pointer-events: none; z-index: 3;
  }
  #stage .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .4s var(--fade); }
  #stage .layer.on { opacity: 1; }
  #stage img.pic { width: 100%; height: 100%; display: block; object-fit: contain; }
  #stage img.pic.fill { object-fit: cover; object-position: top center; }
  #stage .scroll { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #stage .scroll img { width: 100%; height: auto; display: block; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--page); position: relative; z-index: 1; }
  #stage .under {                       /* shows only if a live site refuses to load in the frame */
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: var(--s4); color: var(--soft); font-size: 13px;
  }
  #stage pre {
    height: 100%; overflow: auto; padding: var(--s4);
    font: 12px/1.6 var(--mono); color: var(--ink); background: var(--page); white-space: pre; tab-size: 2;
  }
  #hint {
    position: absolute; left: 50%; bottom: var(--s3); transform: translateX(-50%); z-index: 4;
    height: 32px; padding: 0 var(--s3); border-radius: 16px; display: flex; align-items: center; gap: var(--s2);
    background: var(--hintbg); color: #fff; font-size: 13px; line-height: 16px;
    opacity: 0; pointer-events: none; transition: opacity .3s var(--fade);
  }
  #hint.on { opacity: 1; }
  #hint svg { width: 8px; height: 10px; }
  @media (max-width: 600px) {
    #stage.tall { aspect-ratio: 4 / 5; }   /* scrolling a whole page, or a live site, needs height on a phone */
  }

  /* row under the stage: versions on the left, ways to look on the right */
  #under {
    display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s4);
    margin-top: var(--s4);
  }
  #under:empty { display: none; }

  #vers { list-style: none; display: flex; gap: var(--s6); overflow-x: auto; padding: 2px; margin: -2px; scrollbar-width: none; }
  #vers::-webkit-scrollbar { display: none; }
  #vers li { position: relative; flex: none; }
  #vers li:not(:last-child)::after {    /* the line from this dot to the next */
    content: ""; position: absolute; top: 4px; left: 13px; height: 0;
    width: calc(100% + var(--s6) - 17px); border-top: 1px solid var(--faint);
  }
  #vers li.to-plan::after { border-top-style: dashed; }
  .ver { display: block; text-align: left; font-size: 13px; line-height: 16px; color: var(--soft); min-height: 44px; }
  .ver .dot { display: block; width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--soft); margin-bottom: var(--s2); background: var(--page); transition: background .2s var(--fade), box-shadow .2s var(--fade); }
  .ver b { display: block; font-weight: 600; }
  .ver:hover, .ver[aria-current="true"] { color: var(--ink); }
  .ver[aria-current="true"] .dot { background: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .ver.plan { color: var(--soft); cursor: default; }
  .ver.plan .dot { box-shadow: none; border: 1px dashed var(--faint); }
  .ver.plan b { font-weight: 400; color: var(--soft); }

  #modes { display: flex; gap: var(--s1); flex: none; margin-left: auto; }
  #modes button {
    height: 32px; padding: 0 12px; border-radius: 16px;
    font-size: 13px; line-height: 16px; color: var(--soft);
    transition: background .15s var(--fade), color .15s var(--fade), transform .15s var(--move);
  }
  #modes button:hover { color: var(--ink); }
  #modes button:active { transform: scale(.97); }
  #modes button[aria-pressed="true"] { background: var(--chip); color: var(--ink); }
  @media (hover: none) { #modes button { height: 44px; border-radius: 22px; padding: 0 var(--s3); } }
  @media (max-width: 600px) {
    #under { flex-direction: column; gap: var(--s3); }
    #modes { margin-left: -12px; }
    #vers { gap: var(--s5); max-width: 100%; }
    #vers li:not(:last-child)::after { width: calc(100% + var(--s5) - 17px); }
  }

  #piece h1 { font-size: 28px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; margin-top: var(--s6); }
  #note { font-size: 17px; line-height: 24px; color: var(--soft); max-width: 680px; margin-top: var(--s2); }
  #facts {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4);
    margin-top: var(--s5); padding-top: var(--s4); border-top: 1px solid var(--line);
  }
  #facts dt { font-size: 13px; line-height: 16px; color: var(--soft); margin-bottom: var(--s1); }
  #facts dd { font-size: 15px; line-height: 24px; overflow-wrap: anywhere; }
  #facts dd a { box-shadow: inset 0 -1px 0 var(--faint); transition: box-shadow .15s var(--fade); }
  #facts dd a:hover { box-shadow: inset 0 -1px 0 var(--ink); }
  #facts dd a svg { width: 8px; height: 8px; margin-left: 6px; vertical-align: 1px; }
  @media (max-width: 600px) {
    #piece h1 { font-size: 24px; line-height: 28px; margin-top: var(--s5); }
    #facts { grid-template-columns: 1fr 1fr; }
  }

  #pager {
    display: flex; justify-content: space-between; gap: var(--s4);
    margin-top: var(--s7); padding-top: var(--s4); border-top: 1px solid var(--line);
    font-size: 13px; line-height: 16px;
  }
  #pager a { display: flex; flex-direction: column; gap: var(--s1); min-height: 44px; max-width: 48%; color: var(--ink); }
  #pager a span { color: var(--soft); }
  #pager a:last-child { text-align: right; margin-left: auto; }
  #pager a b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pager a:hover b { box-shadow: inset 0 -1px 0 var(--ink); }

  /* ------------------------------------------------------------------
     Motion: a page arrives with a short fade and rise. Reduced motion gets a plain fade.
     ------------------------------------------------------------------ */
  @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  .arrive { animation: arrive .45s var(--move) both; }
  @media (prefers-reduced-motion: reduce) {
    .arrive { animation: appear .2s linear both; }
    .frame, .menu ul, .menu > button svg, #modes button, #theme svg { transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>

<header id="bar">
  <div class="side">
    <div class="menu home-only" id="m-folder">
      <button aria-haspopup="true" aria-expanded="false"><span></span><svg viewBox="0 0 8 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l3 3 3-3"/></svg></button>
      <ul></ul>
    </div>
    <div class="menu home-only" id="m-sort">
      <button aria-haspopup="true" aria-expanded="false"><span></span><svg viewBox="0 0 8 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l3 3 3-3"/></svg></button>
      <ul></ul>
    </div>
    <a id="back" class="piece-only" href="#all"><svg viewBox="0 0 6 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 1L1 5l4 4"/></svg><span></span></a>
  </div>
  <div class="side">
    <div class="menu right home-only" id="m-year">
      <button class="num" aria-haspopup="true" aria-expanded="false" aria-label="Jump to a year"><span></span><svg viewBox="0 0 8 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l3 3 3-3"/></svg></button>
      <ul></ul>
    </div>
    <button id="theme" aria-label="Switch light and dark">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<main id="home" aria-label="Archive"></main>

<article id="piece">
  <div class="col">
    <div id="stage"></div>
    <div id="under"></div>
    <h1 id="p-title"></h1>
    <p id="note"></p>
    <dl id="facts"></dl>
    <nav id="pager" aria-label="Next and previous"></nav>
  </div>
</article>

<script>
/* ====================================================================
   DATA. One list behind the whole site.
   A piece with one look can be written flat (date, img and so on right on the piece).
   A piece with several looks has "versions"; each finished version gets its own tile,
   placed at its own date. See archive-design-spec.md, section 4, for every field.
   ==================================================================== */
var FOLDERS = [
  { id: "websites",   name: "Websites" },
  { id: "apps",       name: "Apps" },
  { id: "games",      name: "Games" },
  { id: "encloud9",   name: "enCloud9" },
  { id: "rip-resale", name: "RIP Resale" },
  { id: "logos",      name: "Logos" }
];

var PIECES = [
  {
    id: "encloud9-com", title: "encloud9.com", kind: "Website",
    link: "https://www.encloud9.com/",
    wayback: "https://web.archive.org/web/*/encloud9.com",
    folders: ["websites", "encloud9"],
    versions: [
      {
        id: "2024-redo", label: "2024 redo",
        date: "2024-06-01", shown: "Summer 2024", precision: "season",
        tool: "WordPress (Divi)",
        note: "The redo Michael did when he started at enCloud9, between May and July 2024. Captured on 12 Nov 2026, a month before the rebuild replaces it.",
        img: "encloud9-2024.jpg",
        full: "encloud9-2024-full.jpg"
      },
      { id: "2026-rebuild", label: "2026 rebuild", pending: true, shown: "Planned Dec 2026" }
    ]
  },
  {
    id: "dynamics365support", title: "dynamics365support.com", kind: "Website",
    date: "2026-09-01", shown: "Before late Sep 2026", precision: "before",
    tool: "Claude",
    note: "enCloud9's Dynamics 365 support site. The first site built with Claude.",
    link: "https://dynamics365support.com/",
    img: "dynamics365support.jpg", peek: "dynamics365support-peek.jpg",
    folders: ["websites", "encloud9"]

}

function renderPager() {
  var nav = $("pager"); nav.innerHTML = "";
  var i = cur.i;
  function link(t, word) {
    var a = el("a"); a.href = href(t);
    a.appendChild(el("span", "", word));
    a.appendChild(el("b", "", t.p.title + (t.p.versions.length > 1 ? ", " + t.v.label : "")));
    return a;
  }
  if (i > 0) nav.appendChild(link(listed[i - 1], "Previous"));
  if (i >= 0 && i < listed.length - 1) nav.appendChild(link(listed[i + 1], "Next"));
  nav.style.display = nav.firstChild ? "" : "none";
}

function showPiece(p, verId) {
  var done = finished(p), v = null;
  done.forEach(function (x) { if (x.id === verId) v = x; });
  if (!v) v = done[done.length - 1];
  if (!v) return false;

  if (!inFolder(p, state.folder)) state.folder = "all";
  listed = tiles();
  var i = -1; listed.forEach(function (t, n) { if (t.p === p && t.v === v) i = n; });

  var samePiece = cur.p === p && document.body.classList.contains("one");
  cur.p = p; cur.v = v; cur.i = i;
  if (!modesFor(v).some(function (m) { return m.id === cur.mode; }) || !samePiece) cur.mode = "picture";

  $("back").href = state.folder === "all" ? "#all" : "#in-" + state.folder;
  $("back").querySelector("span").textContent = folderName(state.folder);

  if (!samePiece) $("stage").innerHTML = "";
  renderStage(); renderUnder(); renderWords(); renderPager();
  document.title = p.title + " · Archive";

  if (!samePiece) {
    document.body.classList.add("one");
    window.scrollTo(0, 0);
    arrive($("piece").querySelector(".col"));
  }
  return true;
}
function arrive(node) { node.classList.remove("arrive"); void node.offsetWidth; node.classList.add("arrive"); }

/* ====================================================================
   ROUTES.  #all   #in-<folder>   #<piece>   #<piece>/<version>
   ==================================================================== */
function route() {
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  closeMenus();
  if (h && h !== "all" && h.indexOf("in-") !== 0) {
    var parts = h.split("/"), p = pieceById(parts[0]);
    if (p) {
      if (!document.body.classList.contains("one")) state.homeY = window.pageYOffset;
      if (showPiece(p, parts[1])) return;
    }
    h = "all";
  }
  var f = h.indexOf("in-") === 0 ? h.slice(3) : "all";
  if (folderName(f) === "All") f = "all";
  var wasPiece = document.body.classList.contains("one");
  var changed = f !== state.folder || !$("home").firstChild;
  state.folder = f;
  document.body.classList.remove("one");
  document.title = "Archive";
  $("stage").innerHTML = "";                    /* stops a live frame or game that was running */
  if (changed) { renderHome(); arrive($("home")); }
  if (wasPiece && !changed) window.scrollTo(0, state.homeY);
  else if (changed) window.scrollTo(0, 0);
  watchYear();
}
window.addEventListener("hashchange", route);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    if (document.querySelector(".menu.open")) { closeMenus(); return; }
    if (document.body.classList.contains("one")) location.hash = $("back").getAttribute("href");
    return;
  }
  if (!document.body.classList.contains("one") || e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "IFRAME" || tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.key === "ArrowLeft" && cur.i > 0) location.hash = href(listed[cur.i - 1]);
  if (e.key === "ArrowRight" && cur.i >= 0 && cur.i < listed.length - 1) location.hash = href(listed[cur.i + 1]);
});

route();
</script>
